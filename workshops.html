<body><main><p class="lab-kicker">CAFÉ, LE SOIR / LES GESTES · 03</p><h1 class="lab-title">不是答题。<br>是把夜晚玩出来。</h1><p class="lab-intro">三间店，三种完全不同的动作：拼街景、编颜色、追着灯光写一笔。每一局都直接改变最后那张夜景。</p><p class="lab-note">这是独立的互动试玩台，不需要加载 3D 街道。试玩进度单独保存，不会改动漫游游戏中的手记。</p><div class="lab-grid" id="workshop-gallery"></div><div class="lab-bar"><button id="journal">查看手记与夜景</button><a href="index.html?view=door&amp;shop=cafe">进入完整 3D 街道 →</a><span id="lab-count" class="lab-gallery-count"></span></div><p class="lab-note">鼠标 / 触控可直接操作；键盘 Tab 切换工具，方向键微调。所有创作都在本机完成，不上传数据，不调用 AI API。三项核心创作完成即可交付 PNG；不需要逐店打卡。</p></main>
